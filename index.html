/* Reference-inspired warm illustrated mobile design */
:root{color:#402b25;background:#fff8f0;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
body{background:#fff8f0;background-image:none}
.wrap{max-width:480px;padding:0 17px 110px;min-height:100dvh;background:#fffaf3;box-shadow:0 0 35px #674c3820}

.eyebrow{color:#b87780;letter-spacing:1.4px;font-size:10px}

.card h2{font-size:21px;color:#41291f;font-weight:850;letter-spacing:-.6px}
.btn{border:0;background:#ffccd4;color:#593a37;border-radius:100px;font-weight:800;padding:13px 17px;box-shadow:none}
.btn.primary{background:#ffb8c6;color:#522e35}.btn.light{background:#fff4ed;border:1px solid #eadbd3}.btn.ghost{border:1px solid #e9d5d1}

.stat{background:#fff4f1;border:0;border-radius:18px;text-align:center}.stat strong{color:#51352f;font-size:27px}
.pill{background:#ffe4e8;color:#ad6075;font-weight:700;padding:5px 10px}
input,textarea,select{border:1px solid #eee0d9;border-radius:17px;background:#fff;color:#432e2a;outline-color:#ffb3c3}

.nav{max-width:480px;left:50%;transform:translateX(-50%);background:#fffdf9f5;border-top:1px solid #f0dfd8;border-radius:19px 19px 0 0;box-shadow:0 -4px 18px #7c4c3310}
.tab{font-size:11px;color:#8e817c;min-width:56px}.tab b{font-size:21px}.tab.active{color:#e16f8b}

const KEY='dalgu_voca_v1';let words=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))words=x.filter(w=>w&&typeof w==='object'&&typeof w.term==='string');}catch(e){};
let tab='home',editId=null,review=[],idx=0,revealed=false,quiz=null,quizIndex=0,quizScore=0,quizPicked=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(words));return true}catch(e){alert('저장 공간이 부족하거나 브라우저 저장이 차단되었습니다. 백업 파일을 내려받으세요.');return false}}
function go(t){tab=t;render();window.scrollTo(0,0)}
function dog(name,alt){return `<img class="dog" src="${DOG[name]}" alt="${alt}">`}
function empty(title,desc,name='sleep'){return `<div class="empty">${dog(name,'달구 원본 그림')}<h2>${title}</h2><p class="muted">${desc}</p></div>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('heroDog').src=({home:DOG.hello,words:DOG.heart,add:DOG.fly,review:DOG.portrait,more:DOG.face})[tab];let h='';if(tab==='home')h=home();if(tab==='words')h=list();if(tab==='add')h=form();if(tab==='review')h=reviewPage();if(tab==='more')h=more();$('app').innerHTML=h;if(tab==='words')drawList();}
function home(){return `<section class="card cover-card"><span class="miniheart">♥</span><div class="heart-scribble">♡ ♡</div><h2>달구랑 오늘도 한 걸음 ♡</h2><p class="muted">좋은 단어로, 좋은 하루를!</p><img class="cover-dog" src="${DOG.face}" alt="원본 달구 연필 초상화"><button class="btn primary" onclick="startAdd()">＋ 새 단어 추가하기</button></section><div class="quickrow"><div class="quick-card"><div class="section-caption">📖 내 단어장</div><strong>${words.length}</strong><div class="section-caption">내가 모은 표현</div></div><div class="quick-card"><div class="section-caption">💗 오늘의 복습</div><strong>${Math.min(10,words.length)}</strong><div class="section-caption">최대 10개씩</div></div></div><section class="card"><div class="row"><h2>내 단어장</h2><button class="btn small light" onclick="go('words');drawList()">전체 보기 ›</button></div>${words.length?words.slice(0,4).map(w=>`<div class="wordrow"><div class="break"><strong>${esc(w.term)}</strong><div class="muted">${esc(w.meaning)}</div></div><button class="btn small light" onclick="startEdit('${w.id}')">보기</button></div>`).join(''):empty('아직 등록된 단어가 없어요!','공부하고 싶은 영어 단어나 구문을 추가해 보세요.','run')}<div class="actions"><button class="btn primary" onclick="startReview()" ${!words.length?'disabled':''}>♡ 랜덤 10개 복습하기</button></div></section>`}
function startAdd(){editId=null;go('add')}function startEdit(id){editId=id;go('add')}
function list(){return `<section class="card"><h2>📖 내 단어장 <span class="pill">${words.length}개</span></h2><div class="toolbar"><input id="search" placeholder="영어·뜻·태그 검색" aria-label="단어 검색" oninput="drawList()"><button class="btn small" onclick="startAdd()">＋ 추가</button></div><div id="results"></div></section>`}
function drawList(){const q=($('search')?.value||'').toLowerCase().trim();const filtered=words.filter(w=>[w.term,w.meaning,w.tags,w.memo].join(' ').toLowerCase().includes(q));$('results').innerHTML=filtered.length?filtered.map(w=>`<div class="wordrow"><div class="break"><strong>${esc(w.term)}</strong> <span class="pill">${esc(w.kind)}</span><div>${esc(w.meaning)}</div>${w.tags?`<small class="muted"># ${esc(w.tags)}</small>`:''}</div><button class="btn small light" onclick="startEdit('${w.id}')">수정</button></div>`).join(''):empty(q?'검색 결과가 없어요':'아직 단어가 없어요','등록 메뉴에서 단어를 추가해 보세요.','face')}
function form(){let w=words.find(w=>w.id===editId)||{};return `<section class="card"><h2>${w.id?'✏️ 단어 수정':'✏️ 새 단어 등록'}</h2><form id="wordForm" onsubmit="submitWord(event)"><label class="label" for="term">영어 단어·숙어·구문 *</label><input id="term" required maxlength="250" value="${esc(w.term||'')}" placeholder="예: take into account"><label class="label" for="kind">종류</label><select id="kind"><option ${w.kind==='단어'?'selected':''}>단어</option><option ${w.kind==='숙어'?'selected':''}>숙어</option><option ${w.kind==='구문'?'selected':''}>구문</option></select><label class="label" for="meaning">한국어 뜻 *</label><textarea id="meaning" required placeholder="뜻을 적어주세요">${esc(w.meaning||'')}</textarea><label class="label" for="pron">발음·품사 (선택)</label><input id="pron" value="${esc(w.pron||'')}" placeholder="예: /rɪˈzɪliənt/, adjective"><label class="label" for="example">영어 예문 (선택)</label><textarea id="example" placeholder="예문을 직접 적어주세요">${esc(w.example||'')}</textarea><label class="label" for="translation">예문 해석 (선택)</label><textarea id="translation" placeholder="예문의 한국어 해석">${esc(w.translation||'')}</textarea><label class="label" for="tags">태그 (선택)</label><input id="tags" value="${esc(w.tags||'')}" placeholder="예: 비즈니스, 회화"><label class="label" for="memo">메모 (선택)</label><textarea id="memo">${esc(w.memo||'')}</textarea><div class="notice">✨ AI 예문 자동 추천은 추후 API 연결 기능이에요. 현재는 직접 예문을 입력할 수 있습니다.</div><div class="actions"><button type="submit" class="btn primary">💗 저장하기</button>${w.id?`<button type="button" class="btn light" onclick="removeWord('${w.id}')">삭제</button>`:''}</div></form></section><section class="card">${dog('run','달리는 달구 원본 그림')}<p class="muted" style="text-align:center">오늘 배운 표현을 잊기 전에 적어보세요!</p></section>`}
function submitWord(e){e.preventDefault();const w={id:editId||((typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'&&crypto.randomUUID())||Date.now().toString()+Math.random()),term:$('term').value.trim(),kind:$('kind').value,meaning:$('meaning').value.trim(),pron:$('pron').value.trim(),example:$('example').value.trim(),translation:$('translation').value.trim(),tags:$('tags').value.trim(),memo:$('memo').value.trim(),correct:0,wrong:0,created:new Date().toISOString()};if(!w.term||!w.meaning)return alert('단어와 뜻을 입력해주세요.');const prev=words.find(x=>x.id===editId);if(prev)Object.assign(w,{correct:prev.correct||0,wrong:prev.wrong||0,created:prev.created});words=words.filter(x=>x.id!==editId);words.unshift(w);if(save()){editId=null;go('words');drawList()}}
function removeWord(id){if(confirm('이 단어를 정말 삭제할까요?')){words=words.filter(w=>w.id!==id);save();editId=null;go('words');drawList()}}
function dailySeed(){const d=new Date();return Number(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`)}
function shuffled(arr,seed){let a=[...arr];for(let i=a.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function startReview(){if(!words.length)return go('review');review=shuffled(words,dailySeed()).slice(0,10);idx=0;revealed=false;go('review')}
function reviewPage(){if(!words.length)return `<section class="card">${empty('복습할 단어가 없어요','단어를 먼저 등록해 주세요.','sleep')}<button class="btn primary" onclick="startAdd()">단어 등록하기</button></section>`;if(!review.length)return `<section class="card"><h2>🎲 오늘의 랜덤 복습</h2>${dog('sleep','잠자는 달구 원본 그림')}<p class="muted">내가 등록한 단어 중 최대 10개를 골라요. 같은 날에는 같은 10개가 나옵니다.</p><button class="btn primary" style="width:100%" onclick="startReview()">복습 시작하기</button></section>`;if(idx>=review.length)return `<section class="card">${empty('복습 완료! 참 잘했어요 💗','오늘도 달구랑 한 걸음 더 성장했어요.','fly')}<button class="btn primary" style="width:100%" onclick="startReview()">다시 복습하기</button></section>`;const w=review[idx];return `<section class="card"><div class="row"><h2>🎲 단어 카드</h2><span class="pill">${idx+1} / ${review.length}</span></div><div class="stat" style="text-align:center;padding:30px 12px"><span class="muted">이 표현의 뜻은?</span><h2 style="font-size:29px;margin-top:12px" class="break">${esc(w.term)}</h2><button class="btn small light" onclick="speak('${w.id}')">🔊 발음 듣기</button></div>${revealed?`<div class="answer"><strong>${esc(w.meaning)}</strong>${w.example?`<hr><p>${esc(w.example)}</p><p class="muted">${esc(w.translation)}</p>`:''}</div><div class="actions"><button class="btn light" onclick="nextReview(false)">😅 몰랐어요</button><button class="btn primary" onclick="nextReview(true)">😊 알았어요</button></div>`:`<button class="btn primary" style="width:100%;margin-top:14px" onclick="revealed=true;render()">뜻 확인하기</button>`}</section>`}
function speak(id){const w=words.find(x=>x.id===id);if(!w)return;if(!('speechSynthesis'in window))return alert('이 브라우저는 음성 읽기를 지원하지 않습니다.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.term);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function nextReview(ok){const w=words.find(x=>x.id===review[idx].id);if(w){w[ok?'correct':'wrong']=(w[ok?'correct':'wrong']||0)+1;save()}idx++;revealed=false;render()}
function startQuiz(){if(words.length<4)return alert('퀴즈는 최소 4개의 단어가 필요해요.');quiz=shuffled(words,Date.now()>>>0).slice(0,10).map(w=>({w,choices:shuffled([w,...shuffled(words.filter(x=>x.id!==w.id&&x.meaning!==w.meaning),Date.now()).slice(0,3)],Math.floor(Math.random()*2**32))}));if(quiz.some(q=>q.choices.length<4)){quiz=null;return alert('서로 다른 뜻을 가진 단어 4개가 필요해요.')}quizIndex=0;quizScore=0;quizPicked=null;go('more')}
function quizPage(){if(!quiz)return '';if(quizIndex>=quiz.length)return `<section class="card">${empty('퀴즈 끝!','정답 '+quizScore+' / '+quiz.length+'개','heart')}<button class="btn" onclick="quiz=null;render()">돌아가기</button></section>`;const q=quiz[quizIndex];return `<section class="card"><div class="row"><h2>🧠 뜻 맞히기</h2><span class="pill">${quizIndex+1}/${quiz.length}</span></div><h2 style="text-align:center;font-size:28px;padding:18px" class="break">${esc(q.w.term)}</h2>${q.choices.map(c=>`<button class="choice ${quizPicked===null?'':c.id===q.w.id?'correct':quizPicked===c.id?'wrong':''}" ${quizPicked!==null?'disabled':''} onclick="pickQuiz('${c.id}')">${esc(c.meaning)}</button>`).join('')}${quizPicked!==null?`<p class="muted">${quizPicked===q.w.id?'정답이에요! 🎉':'정답: '+esc(q.w.meaning)}</p><button class="btn primary" style="width:100%" onclick="quizIndex++;quizPicked=null;render()">다음 문제</button>`:''}</section>`}
function pickQuiz(id){if(quizPicked!==null)return;quizPicked=id;const w=words.find(x=>x.id===quiz[quizIndex].w.id);if(id===w.id){quizScore++;w.correct=(w.correct||0)+1}else w.wrong=(w.wrong||0)+1;save();render()}
function more(){if(quiz)return quizPage();const correct=words.reduce((a,w)=>a+(w.correct||0),0),wrong=words.reduce((a,w)=>a+(w.wrong||0),0);return `<section class="card"><h2>🧠 퀴즈와 학습 기록</h2><div class="grid"><div class="stat"><span class="muted">알았어요</span><strong>${correct}</strong></div><div class="stat"><span class="muted">몰랐어요</span><strong>${wrong}</strong></div></div><div class="actions"><button class="btn primary" onclick="startQuiz()" ${words.length<4?'disabled':''}>4지선다 퀴즈</button></div><p class="muted">퀴즈는 뜻이 다른 단어가 4개 이상 필요합니다.</p>${dog('fly','날아가는 달구 원본 그림')}</section><section class="card"><h2>📦 백업과 가져오기</h2><p class="muted">브라우저 기록을 지우거나 휴대폰을 바꾸면 단어가 사라질 수 있어요. 꼭 백업 파일을 저장하세요.</p><div class="actions"><button class="btn light" onclick="exportJSON()">전체 백업(.json)</button><button class="btn light" onclick="exportCSV()">CSV 내보내기</button></div><label class="label" for="file">백업 파일 가져오기 (.json 또는 .csv)</label><input id="file" type="file" accept=".json,.csv,application/json,text/csv" onchange="importFile(event)"><p class="muted">가져온 단어는 기존 단어에 추가됩니다. 동일 영어 표현은 중복을 피합니다.</p></section><section class="card"><h2>💌 앞으로 추가할 기능</h2><div class="notice">AI 예문 자동 추천과 매일 카카오톡 자동 발송은 현재 연결되지 않았습니다. 이 앱은 인터넷 없이도 기본 단어장과 복습 기능을 사용할 수 있습니다.</div>${dog('face','연필로 그린 달구 얼굴 원본 그림')}</section>`}
function download(content,name,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download(JSON.stringify({app:'dalgu-voca',version:1,words},null,2),'달구단어장-백업.json','application/json')}
const fields=['term','kind','meaning','pron','example','translation','tags','memo'];function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}function exportCSV(){download('\ufeff'+fields.join(',')+'\r\n'+words.map(w=>fields.map(k=>csvCell(w[k])).join(',')).join('\r\n'),'달구단어장.csv','text/csv;charset=utf-8')}
function parseCSV(s){s=s.replace(/^\ufeff/,'');let rows=[],row=[],val='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){val+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(val);val=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(val);if(row.some(v=>v.trim()))rows.push(row);row=[];val=''}else val+=c}row.push(val);if(row.some(v=>v.trim()))rows.push(row);const heads=rows.shift()?.map(x=>x.trim())||[];if(!heads.includes('term')||!heads.includes('meaning'))throw Error('CSV 첫 줄에 term, meaning 열이 필요합니다.');return rows.map(r=>Object.fromEntries(heads.map((h,i)=>[h,r[i]||''])))}
async function importFile(e){const file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('5MB 이하 파일만 가져올 수 있어요.');let text=await file.text(),raw=file.name.toLowerCase().endsWith('.json')?JSON.parse(text):parseCSV(text);if(!Array.isArray(raw))raw=raw.words;if(!Array.isArray(raw))throw Error('지원하지 않는 백업 파일입니다.');if(raw.length>10000)throw Error('한 번에 최대 10,000개까지 가져올 수 있어요.');const seen=new Set(words.map(w=>w.term.toLowerCase().trim()));let count=0;for(const x of raw){if(!x||typeof x.term!=='string'||typeof x.meaning!=='string')continue;let term=x.term.trim().slice(0,250),meaning=x.meaning.trim().slice(0,3000);if(!term||!meaning||seen.has(term.toLowerCase()))continue;seen.add(term.toLowerCase());words.push({id:(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'&&crypto.randomUUID())||Date.now()+''+Math.random(),term,meaning,kind:String(x.kind||'단어').slice(0,30),pron:String(x.pron||'').slice(0,500),example:String(x.example||'').slice(0,3000),translation:String(x.translation||'').slice(0,3000),tags:String(x.tags||'').slice(0,300),memo:String(x.memo||'').slice(0,3000),correct:Number(x.correct)||0,wrong:Number(x.wrong)||0,created:new Date().toISOString()});count++}if(save()){alert(count+'개 단어를 가져왔어요!');go('words');drawList()}}catch(err){alert('가져오기 실패: '+err.message)}finally{e.target.value=''}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.tab==='add')editId=null;if(b.dataset.tab==='review')review=[];if(b.dataset.tab==='more')quiz=null;go(b.dataset.tab);if(tab==='words')drawList()}));render();
</script></body></html>
